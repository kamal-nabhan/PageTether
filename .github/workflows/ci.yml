name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    name: Analyze, test, and build (Android/web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed for AGP 8.9 (the app's pinned Android toolchain).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release

      # ubuntu-latest ships the Android SDK; the app compiles without
      # GOOGLE_WEB_CLIENT_ID, so no extra secrets are needed here.
      - name: Build APK (debug)
        run: flutter build apk --debug

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # windows-latest runners already have the VS 2022 C++ toolchain.
      - name: Build Windows (release)
        run: flutter build windows --release
