name: Deploy Web

# Builds the Flutter web app and publishes it to GitHub Pages on every push
# to main (and on manual dispatch). Live at:
#   https://kamal-nabhan.github.io/PageTether/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Public OAuth Web client id (overridable via an Actions variable). Google
  # sign-in on the hosted site also requires adding the Pages URL as an
  # authorized JavaScript origin on this client in Google Cloud Console.
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '76503627531-qhnsfvmns4mbpovd2c0bpd30ba81ejbo.apps.googleusercontent.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web (project-page base href)
        run: flutter build web --release --base-href /PageTether/ --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
      # Pages must be enabled once manually (Settings → Pages → Source:
      # "GitHub Actions") — the default workflow token can't enable it via API.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
